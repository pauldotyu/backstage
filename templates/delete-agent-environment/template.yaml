apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: delete-agent-environment
  title: Request removal of agent environment
  description: Removes an agent environment from Azure
spec:
  owner: group:default/backstage-admins
  type: resource
  parameters:
    - title: Identify the agent environment to delete
      description: Enter the existing request identifier, not the Kubernetes namespace or Argo CD Application name.
      required:
        - team
        - project
        - environment
      properties:
        team:
          title: Team
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        project:
          title: Project
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        environment:
          title: Environment
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    - title: Confirm deletion request
      description: Review the team, project, and environment in the final review before submitting. This task creates a PR only, not a completed deletion.
      required:
        - confirmEnvironmentIdentifier
        - acknowledgeDestruction
      properties:
        confirmEnvironmentIdentifier:
          title: I confirm the entered team/project/environment is the exact environment identifier I intend to delete
          type: boolean
          default: false
          not:
            enum: [false]
        acknowledgeDestruction:
          title: I understand merging the removal PR authorizes irreversible teardown of this environment and may permanently delete its data
          type: boolean
          default: false
          not:
            enum: [false]
  steps:
    - id: verify
      name: Verify request file exists on main (missing file stops the task)
      action: fetch:plain:file
      input:
        url: https://github.com/pauldotyu/platform/blob/main/requests/agent-environments/${{ parameters.team }}/${{ parameters.project }}/${{ parameters.environment }}/environment.yaml
        targetPath: deletion-check/environment.yaml
    - id: clear
      name: Remove local verification copy before publishing
      action: fs:delete
      input:
        files:
          - deletion-check/environment.yaml
    - id: publish
      name: Open environment removal PR for human review
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=pauldotyu&repo=platform
        targetBranchName: main
        branchName: delete-agent-${{ parameters.team }}-${{ parameters.project }}-${{ parameters.environment }}
        title: "Agent environment delete request for ${{ parameters.team }}"
        description: |
          Request deletion of agent environment `${{ parameters.team }}/${{ parameters.project }}/${{ parameters.environment }}`.

          Remove `requests/agent-environments/${{ parameters.team }}/${{ parameters.project }}/${{ parameters.environment }}/environment.yaml`
          and its matching `catalog/agent-environments/${{ parameters.team }}/${{ parameters.project }}/${{ parameters.environment }}/catalog-info.yaml`, if present.
          Requested by: ${{ user.ref }}

          The requester confirmed the agent environment identifier and acknowledged irreversible teardown and possible permanent data loss.
          Human review and merge into protected `main` authorize deletion. Do not auto-merge.
          After merge, the request Application prunes the XR; Crossplane/OpenTofu perform teardown.
          A successful Backstage task means this removal PR was created, not that resources were destroyed.
          Catalog discovery removes the inventory entry after merge; this does not confirm teardown is complete.

          Reviewers: verify the agent environment identifier, request and catalog descriptor deletions, ownership/authorization, backups, and active workloads before merging.
        # Only the now-empty probe directory is serialized, never the whole workspace.
        sourcePath: deletion-check
        filesToDelete:
          - requests/agent-environments/${{ parameters.team }}/${{ parameters.project }}/${{ parameters.environment }}/environment.yaml
          - catalog/agent-environments/${{ parameters.team }}/${{ parameters.project }}/${{ parameters.environment }}/catalog-info.yaml
        draft: false
        update: false
  output:
    links:
      - title: Review removal PR (agent environment is not yet destroyed)
        url: ${{ steps.publish.output.remoteUrl }}
