apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: delete-agent-environment
  title: Request removal of agent environment
  description: Removes an agent environment from Azure
spec:
  owner: group:default/backstage-admins
  type: resource
  parameters:
    - title: Identify the agent environment to delete
      required:
        - environmentRef
      properties:
        environmentRef:
          title: Agent environment
          type: string
          description: Environments owned by you or your teams.
          ui:field: OwnedEntityPicker
          ui:autofocus: true
          ui:options:
            catalogFilter:
              kind: Resource
              type: agent-environment
    - title: Confirm deletion request
      description: Review the team, project, and environment in the final review before submitting. This task creates a PR only, not a completed deletion.
      required:
        - confirmEnvironmentIdentifier
        - acknowledgeDestruction
      properties:
        confirmEnvironmentIdentifier:
          title: I confirm the entered team/project/environment is the exact environment identifier I intend to delete
          type: boolean
          default: false
          not:
            enum: [false]
          ui:help: You must confirm the environment identifier to proceed with deletion.
        acknowledgeDestruction:
          title: I understand merging the removal PR authorizes irreversible teardown of this environment and may permanently delete its data
          type: boolean
          default: false
          not:
            enum: [false]
          ui:help: You must acknowledge the destruction to proceed with deletion.
  steps:
    - id: lookup
      name: Look up the environment
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.environmentRef }}
    - id: verify
      name: Verify request file exists on main (missing file stops the task)
      action: fetch:plain:file
      input:
        url: https://github.com/pauldotyu/platform/blob/main/requests/agent-environments/${{ steps.lookup.output.entity.metadata.labels.team }}/${{ steps.lookup.output.entity.metadata.labels.project }}/${{ steps.lookup.output.entity.metadata.labels.environment }}/environment.yaml
        targetPath: deletion-check/environment.yaml
    - id: clear
      name: Remove local verification copy before publishing
      action: fs:delete
      input:
        files:
          - deletion-check/environment.yaml
    - id: publish
      name: Open environment removal PR for human review
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=pauldotyu&repo=platform
        targetBranchName: main
        branchName: delete-agent-${{ steps.lookup.output.entity.metadata.labels.team }}-${{ steps.lookup.output.entity.metadata.labels.project }}-${{ steps.lookup.output.entity.metadata.labels.environment }}
        title: "Agent environment delete request for ${{ steps.lookup.output.entity.metadata.labels.team }}"
        description: |
          Request deletion of agent environment `${{ steps.lookup.output.entity.metadata.labels.team }}/${{ steps.lookup.output.entity.metadata.labels.project }}/${{ steps.lookup.output.entity.metadata.labels.environment }}`.

          Remove `requests/agent-environments/${{ steps.lookup.output.entity.metadata.labels.team }}/${{ steps.lookup.output.entity.metadata.labels.project }}/${{ steps.lookup.output.entity.metadata.labels.environment }}/environment.yaml`
          and its matching `catalog/agent-environments/${{ steps.lookup.output.entity.metadata.labels.team }}/${{ steps.lookup.output.entity.metadata.labels.project }}/${{ steps.lookup.output.entity.metadata.labels.environment }}/catalog-info.yaml`, if present.
          Requested by: ${{ user.ref }}

          The requester confirmed the agent environment identifier and acknowledged irreversible teardown and possible permanent data loss.
          Human review and merge into protected `main` authorize deletion. Do not auto-merge.
          After merge, the request Application prunes the XR; Crossplane/OpenTofu perform teardown.
          A successful Backstage task means this removal PR was created, not that resources were destroyed.
          Catalog discovery removes the inventory entry after merge; this does not confirm teardown is complete.

          Reviewers: verify the agent environment identifier, request and catalog descriptor deletions, ownership/authorization, backups, and active workloads before merging.
        # Only the now-empty probe directory is serialized, never the whole workspace.
        sourcePath: deletion-check
        filesToDelete:
          - requests/agent-environments/${{ steps.lookup.output.entity.metadata.labels.team }}/${{ steps.lookup.output.entity.metadata.labels.project }}/${{ steps.lookup.output.entity.metadata.labels.environment }}/environment.yaml
          - catalog/agent-environments/${{ steps.lookup.output.entity.metadata.labels.team }}/${{ steps.lookup.output.entity.metadata.labels.project }}/${{ steps.lookup.output.entity.metadata.labels.environment }}/catalog-info.yaml
        draft: false
        update: false
  output:
    links:
      - title: Review removal PR (agent environment is not yet destroyed)
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Teardown completes after merge. Check the environment's Kubernetes tab
        url: ${{ backstageBaseUrl }}/catalog/default/resource/${{ steps.lookup.output.entity.metadata.labels.team }}-${{ steps.lookup.output.entity.metadata.labels.project }}-${{ steps.lookup.output.entity.metadata.labels.environment }}
