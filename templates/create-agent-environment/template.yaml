apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-agent-environment
  title: Request new agent environment
  description: Creates a new agent environment on Azure
spec:
  owner: group:default/backstage-admins
  type: resource
  parameters:
    - title: Environment details
      required:
        - owner
        - team
        - project
        - environment
        - location
        - costCenter
      properties:
        owner:
          title: Owner
          type: string
          description: The Backstage group that owns this environment. Only groups you belong to are listed.
          ui:field: MyGroupsPicker
          ui:autofocus: true
        team:
          title: Team
          type: string
          description: The team requesting the environment
          minLength: 1
          maxLength: 20
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        project:
          title: Project
          type: string
          description: The project associated with the environment
          minLength: 1
          maxLength: 20
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        environment:
          title: Environment
          type: string
          description: The environment name (e.g., dev, staging, prod)
          minLength: 1
          maxLength: 20
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        size:
          title: Size
          type: string
          enum:
            - small
            - medium
            - large
          enumNames:
            - "Small: 1 CPU / 2 GiB guaranteed, up to 4 CPU / 8 GiB burst"
            - "Medium: 2 CPU / 4 GiB guaranteed, up to 8 CPU / 16 GiB burst"
            - "Large: 4 CPU / 8 GiB guaranteed, up to 16 CPU / 32 GiB burst"
          default: small
        location:
          title: Region
          type: string
          description: The Azure region where the environment will be deployed
          default: westus3
          enum:
            - westus3
            - eastus
            - centralus
        costCenter:
          title: Cost Center
          type: string
          description: The cost center associated with the environment
          minLength: 1
          maxLength: 20
          pattern: '^[a-zA-Z0-9]+(-[a-zA-Z0-9]+)*$'
    - title: Application delivery (optional)
      description: Leave blank to get an empty environment. Fill in to have the platform deploy your Helm chart into it.
      properties:
        deliveryRepoUrl:
          title: Chart repository
          type: string
          description: GitHub repository that contains your Helm chart.
          pattern: '^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
          ui:help: "For example: https://github.com/pauldotyu/fourth-coffee"
        deliveryPath:
          title: Chart path
          type: string
          pattern: '^[A-Za-z0-9_./-]+$'
          ui:help: "For example: deploy/helm/fourth-coffee"
        deliveryRevision:
          title: Branch or tag
          type: string
          default: main
        agents:
          title: Model-calling components
          type: array
          description: Each gets a ServiceAccount with model and telemetry access. Names must match your chart's component names.
          default: [foundry]
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z]([a-z0-9-]{0,18}[a-z0-9])?$'
        telemetryOnly:
          title: Telemetry-only components
          type: array
          description: Each gets a ServiceAccount with telemetry access only.
          default: []
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z]([a-z0-9-]{0,18}[a-z0-9])?$'
      dependencies:
        deliveryRepoUrl:
          required: [deliveryPath]
  steps:
    - id: render
      name: Generate agent environment request and catalog resource
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ./output
        values:
          owner: ${{ parameters.owner }}
          requestedBy: ${{ user.ref }}
          team: ${{ parameters.team }}
          project: ${{ parameters.project }}
          environment: ${{ parameters.environment }}
          size: ${{ parameters.size }}
          location: ${{ parameters.location }}
          costCenter: ${{ parameters.costCenter }}
          requesterObjectId: ${{ user.entity.metadata.annotations["graph.microsoft.com/user-id"] }}
          backstageBaseUrl: ${{ backstageBaseUrl }}
          deliveryRepoUrl: ${{ parameters.deliveryRepoUrl }}
          deliveryPath: ${{ parameters.deliveryPath }}
          deliveryRevision: ${{ parameters.deliveryRevision }}
          agents: ${{ parameters.agents }}
          telemetryOnly: ${{ parameters.telemetryOnly }}
    - id: publish
      name: Open agent environment request PR
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=pauldotyu&repo=platform
        targetBranchName: main
        branchName: request-agent-environment-${{ parameters.team }}-${{ parameters.project }}-${{ parameters.environment }}
        title: "Agent environment request for ${{ parameters.team }}"
        description: |
          ${{ parameters.team }} requesting an agent environment with the following details:
          Project: ${{ parameters.project }}
          Environment name: ${{ parameters.environment }}
          Location: ${{ parameters.location }}
          Cost Center: ${{ parameters.costCenter }}
          Delivery: ${{ parameters.deliveryRepoUrl or "none" }} ${{ parameters.deliveryPath or "" }}
          Owning team: ${{ parameters.owner }}
          Requested by: ${{ user.ref }}

          Includes a catalog resource owned by the requester. Backstage discovers it after merge into main.
          Catalog visibility records an accepted request, not a successful deployment.
        sourcePath: ./output
  output:
    links:
      - title: 1. Review agent environment request
        url: ${{ steps.publish.output.remoteUrl }}
      - title: 2. Open the environment in the catalog (available after merge)
        url: ${{ backstageBaseUrl }}/catalog/default/resource/${{ parameters.team }}-${{ parameters.project }}-${{ parameters.environment }}