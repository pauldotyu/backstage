apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-agent-environment
  title: Request new agent environment
  description: Creates a new agent environment on Azure
spec:
  owner: group:default/backstage-admins
  type: resource
  parameters:
    - title: Environment details
      required:
        - team
        - project
        - environment
        - location
        - costCenter
      properties:
        team:
          title: Team
          type: string
          description: The team requesting the environment
          minLength: 1
          maxLength: 20
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        project:
          title: Project
          type: string
          description: The project associated with the environment
          minLength: 1
          maxLength: 20
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        environment:
          title: Environment
          type: string
          description: The environment name (e.g., dev, staging, prod)
          minLength: 1
          maxLength: 20
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        location:
          title: Region
          type: string
          description: The Azure region where the environment will be deployed
          default: westus3
          enum:
            - westus3
            - eastus
            - centralus
        costCenter:
          title: Cost Center
          type: string
          description: The cost center associated with the environment
          minLength: 1
          maxLength: 20
          pattern: '^[a-zA-Z0-9]+(-[a-zA-Z0-9]+)*$'
  steps:
    - id: render
      name: Generate agent environment request and catalog resource
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ./output
        values:
          team: ${{ parameters.team }}
          project: ${{ parameters.project }}
          environment: ${{ parameters.environment }}
          location: ${{ parameters.location }}
          costCenter: ${{ parameters.costCenter }}
          requesterObjectId: ${{ user.entity.metadata.annotations["graph.microsoft.com/user-id"] }}
          owner: ${{ user.ref }}
    - id: publish
      name: Open agent environment request PR
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=pauldotyu&repo=crossplane-opentofu-demo
        targetBranchName: main
        branchName: request-agent-environment-${{ parameters.team }}-${{ parameters.project }}-${{ parameters.environment }}
        title: "Agent environment request for ${{ parameters.team }}"
        description: |
          ${{ parameters.team }} requesting an agent environment with the following details:
          Project: ${{ parameters.project }}
          Environment name: ${{ parameters.environment }}
          Location: ${{ parameters.location }}
          Cost Center: ${{ parameters.costCenter }}
          Requested by: ${{ user.ref }}

          Includes a catalog resource owned by the requester. Backstage discovers it after merge into main.
          Catalog visibility records an accepted request, not a successful deployment.
        sourcePath: ./output
  output:
    links:
      - title: Review agent environment request
        url: ${{ steps.publish.output.remoteUrl }}