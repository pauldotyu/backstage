apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ${{ values.team }}-${{ values.project }}-${{ values.environment }}
  description: Agent environment requested through Backstage
  labels:
    team: ${{ values.team | dump }}
    project: ${{ values.project | dump }}
    environment: ${{ values.environment | dump }}
    region: ${{ values.location | dump }}
  annotations:
    platform.example.org/requested-by: ${{ values.requestedBy | dump }}
    backstage.io/source-template: template:default/create-agent-environment
    backstage.io/kubernetes-namespace: agent-environments
    backstage.io/kubernetes-label-selector: crossplane.io/composite=${{ values.team }}-${{ values.project }}-${{ values.environment }}
  links:
    - url: https://github.com/pauldotyu/platform/blob/main/requests/agent-environments/${{ values.team }}/${{ values.project }}/${{ values.environment }}/environment.yaml
      title: Environment request
    - url: >-
        ${{ values.backstageBaseUrl }}/create/templates/default/delete-agent-environment?formData=${{ { environmentRef: "resource:default/" + values.team + "-" + values.project + "-" + values.environment } | dump | urlencode }}
      title: Request deletion
{%- if values.exposeService %}
    - url: https://${{ values.team }}-${{ values.project }}-${{ values.environment }}.apps.aks.rocks
      title: Open the application
{%- endif %}
spec:
  type: agent-environment
  owner: ${{ values.owner | dump }}