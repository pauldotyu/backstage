# Deployment values for Entra sign-in, user/group ingestion, and agent environments.
#
# Create the secret first so credentials never land in a values file:
#
#   kubectl create namespace backstage
#   kubectl -n backstage create secret generic backstage-secrets \
#     --from-literal=AUTH_MICROSOFT_CLIENT_SECRET='<client-secret>' \
#     --from-literal=GITHUB_TOKEN='<github-pat>'
#
# Then install:
#
#   helm upgrade --install backstage ./charts/backstage -n backstage \
#     -f charts/backstage/examples/values-entra.yaml
#
# Register this redirect URI on the Entra app registration (Web platform):
#   https://<host>/api/auth/microsoft/handler/frame
#   (for a port-forward test, http://localhost:7007/api/auth/microsoft/handler/frame also works)
# Then create a DNS A record for <host> pointing at the Gateway address:
#   kubectl -n backstage get gateway backstage -o jsonpath='{.status.addresses[0].value}'

existingSecret: backstage-secrets

# Read access to environments in this cluster. The namespace must already exist.
agentEnvironments:
  enabled: true
  namespace: agent-environments

# AKS application routing add-on, Istio Gateway API implementation.
# TLS certificate is issued by cert-manager; see cluster-issuer-azure-dns.yaml.
gateway:
  enabled: true
  className: approuting-istio
  host: backstage.example.com
  tls:
    enabled: true
    certManager:
      issuerRef:
        name: letsencrypt
        kind: ClusterIssuer

appConfig:
  app:
    baseUrl: https://backstage.example.com
  backend:
    baseUrl: https://backstage.example.com
    cors:
      origin: https://backstage.example.com

  auth:
    environment: production
    providers:
      microsoft:
        production:
          clientId: <entra-app-client-id>
          clientSecret: ${AUTH_MICROSOFT_CLIENT_SECRET}
          tenantId: <entra-tenant-id>
          domainHint: <entra-tenant-id>
          signIn:
            resolvers:
              - resolver: emailMatchingUserEntityAnnotation

  catalog:
    providers:
      microsoftGraphOrg:
        default:
          tenantId: <entra-tenant-id>
          clientId: <entra-app-client-id>
          clientSecret: ${AUTH_MICROSOFT_CLIENT_SECRET}
          userGroupMember:
            filter: id eq '<entra-group-object-id>'
          group:
            filter: id eq '<entra-group-object-id>'
          schedule:
            frequency: { minutes: 30 }
            timeout: { minutes: 3 }

  kubernetes:
    serviceLocatorMethod:
      type: singleTenant
    customResources:
      - group: platform.example.org
        apiVersion: v1alpha1
        plural: xagentenvironments
    # Fetch configured custom resources only, not unrelated workloads or Secrets.
    objectTypes: []
    clusterLocatorMethods:
      - type: config
        clusters:
          - name: in-cluster
            url: https://kubernetes.default.svc
            # Omit serviceAccountToken to use the pod's service account.
            authProvider: serviceAccount
            skipMetricsLookup: true
