{{- if and .Values.gateway.enabled .Values.gateway.create }}
{{- $tls := .Values.gateway.tls.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "backstage.gatewayName" . }}
  labels:
    {{- include "backstage.labels" . | nindent 4 }}
    {{- /* Istio copies Gateway labels onto its gateway pods, so these must not match the backend Service selector. */}}
    app.kubernetes.io/name: {{ include "backstage.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: {{ .Values.gateway.http.listenerName }}
      protocol: HTTP
      port: {{ .Values.gateway.http.port }}
      {{- with .Values.gateway.host }}
      hostname: {{ . | quote }}
      {{- end }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- if $tls }}
    - name: {{ .Values.gateway.tls.listenerName }}
      protocol: HTTPS
      port: {{ .Values.gateway.tls.port }}
      hostname: {{ required "gateway.host is required when gateway.tls.enabled=true" .Values.gateway.host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ include "backstage.tlsSecretName" . }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
{{- end }}
