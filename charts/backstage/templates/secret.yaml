{{- if .Values.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backstage.fullname" . }}-env
  labels:
    {{- include "backstage.labels" . | nindent 4 }}
    {{- include "backstage.selectorLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secretEnv }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
