{{- if .Values.agentEnvironments.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "backstage.fullname" . }}-{{ .Release.Namespace }}-agent-environments
  namespace: {{ .Values.agentEnvironments.namespace }}
  labels:
    {{- include "backstage.labels" . | nindent 4 }}
rules:
  - apiGroups: [platform.example.org]
    resources: [xagentenvironments]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "backstage.fullname" . }}-{{ .Release.Namespace }}-agent-environments
  namespace: {{ .Values.agentEnvironments.namespace }}
  labels:
    {{- include "backstage.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "backstage.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "backstage.fullname" . }}-{{ .Release.Namespace }}-agent-environments
{{- end }}
