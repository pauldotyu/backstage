{{- if and .Values.gateway.enabled .Values.gateway.create .Values.gateway.tls.enabled .Values.gateway.tls.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "backstage.fullname" . }}-tls
  labels:
    {{- include "backstage.labels" . | nindent 4 }}
    {{- include "backstage.selectorLabels" . | nindent 4 }}
spec:
  secretName: {{ include "backstage.tlsSecretName" . }}
  dnsNames:
    - {{ .Values.gateway.host | quote }}
  issuerRef:
    name: {{ required "gateway.tls.certManager.issuerRef.name is required" .Values.gateway.tls.certManager.issuerRef.name }}
    kind: {{ .Values.gateway.tls.certManager.issuerRef.kind }}
    group: cert-manager.io
  {{- with .Values.gateway.tls.certManager.duration }}
  duration: {{ . }}
  {{- end }}
  {{- with .Values.gateway.tls.certManager.renewBefore }}
  renewBefore: {{ . }}
  {{- end }}
{{- end }}
