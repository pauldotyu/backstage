name: Container image and Helm chart

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: |
          helm lint charts/backstage
          helm lint charts/backstage -f charts/backstage/examples/values-entra.yaml

  publish-chart:
    if: github.event_name != 'pull_request'
    needs: [build, helm-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4

      - name: Compute chart version
        id: version
        run: |
          base=$(yq '.version' charts/backstage/Chart.yaml)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            app_version="$version"
          else
            app_version="sha-${GITHUB_SHA::7}"
            version="${base}-${app_version}"
          fi
          {
            echo "version=$version"
            echo "app_version=$app_version"
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: |
          helm package charts/backstage --destination dist \
            --version '${{ steps.version.outputs.version }}' \
            --app-version '${{ steps.version.outputs.app_version }}'

      - name: Push chart to GHCR
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | helm registry login ${{ env.REGISTRY }} \
            --username '${{ github.actor }}' --password-stdin
          helm push dist/backstage-${{ steps.version.outputs.version }}.tgz \
            oci://${{ env.REGISTRY }}/${{ steps.version.outputs.owner }}/charts
